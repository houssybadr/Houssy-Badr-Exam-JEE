<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-people me-2 text-primary"></i>Gestion des Clients</h3>
    <button class="btn btn-primary" (click)="openCreate()">
      <i class="bi bi-plus-lg me-1"></i>Nouveau Client
    </button>
  </div>

  <div *ngIf="message" class="alert alert-success alert-dismissible">{{ message }}
    <button type="button" class="btn-close" (click)="message=''"></button>
  </div>
  <div *ngIf="error" class="alert alert-danger alert-dismissible">{{ error }}
    <button type="button" class="btn-close" (click)="error=''"></button>
  </div>

  <!-- Formulaire -->
  <div *ngIf="showForm" class="card mb-4 border-primary">
    <div class="card-header bg-primary text-white fw-bold">
      {{ editMode ? 'Modifier le Client' : 'Nouveau Client' }}
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nom *</label>
          <input [(ngModel)]="selected.nom" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email *</label>
          <input [(ngModel)]="selected.email" type="email" class="form-control" required>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-success" (click)="save()"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
        <button class="btn btn-secondary" (click)="showForm=false">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Recherche -->
  <div class="input-group mb-3" style="max-width:350px">
    <input [(ngModel)]="searchNom" class="form-control" placeholder="Rechercher par nom...">
    <button class="btn btn-outline-secondary" (click)="search()"><i class="bi bi-search"></i></button>
    <button class="btn btn-outline-secondary" (click)="searchNom=''; load()">
      <i class="bi bi-x"></i>
    </button>
  </div>

  <!-- Tableau -->
  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-primary">
          <tr>
            <th>#</th><th>Nom</th><th>Email</th><th>Contrats</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of clients">
            <td>{{ c.id }}</td>
            <td><strong>{{ c.nom }}</strong></td>
            <td><a [href]="'mailto:'+c.email">{{ c.email }}</a></td>
            <td><span class="badge bg-primary">{{ c.nombreContrats ?? 0 }}</span></td>
            <td>
              <a [routerLink]="['/contrats']" [queryParams]="{clientId: c.id}"
                 class="btn btn-sm btn-outline-info me-1" title="Voir contrats">
                <i class="bi bi-file-earmark-text"></i>
              </a>
              <button class="btn btn-sm btn-outline-warning me-1" (click)="openEdit(c)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(c.id!)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="clients.length === 0">
            <td colspan="5" class="text-center text-muted py-4">Aucun client trouvé</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
