<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card p-4 shadow" style="width:380px">
    <div class="text-center mb-4">
      <i class="bi bi-shield-check text-primary" style="font-size:3rem"></i>
      <h4 class="mt-2 fw-bold">AssuranceApp</h4>
      <p class="text-muted small">Houssy Badr — Examen JEE</p>
    </div>

    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nom d'utilisateur</label>
        <input [(ngModel)]="username" name="username"
               class="form-control" placeholder="admin / employe1 / client1" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Mot de passe</label>
        <input [(ngModel)]="password" name="password" type="password"
               class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Se connecter
      </button>
    </form>

    <div class="mt-3 text-muted small text-center">
      <strong>Comptes de test :</strong><br>
      admin / admin123 &nbsp;|&nbsp; employe1 / employe123 &nbsp;|&nbsp; client1 / client123
    </div>
  </div>
</div>
