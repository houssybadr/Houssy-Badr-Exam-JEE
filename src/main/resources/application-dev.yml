spring:
  datasource:
    url: jdbc:h2:mem:assurancedb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    ma.houssybadr: DEBUG
    org.hibernate.SQL: DEBUG
